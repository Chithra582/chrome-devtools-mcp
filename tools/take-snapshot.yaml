name: take-snapshot
description: Captures an accessibility text snapshot of the DOM tree with interactive element UIDs.
input_schema:
  type: object
  properties:
    page_id:
      type: string
      description: Target page identifier.
    include_snapshot:
      type: boolean
      description: Whether to return the full structural snapshot in response.
      default: true
    file_path:
      type: string
      description: Optional local file path to write snapshot output to.
  required:
    - page_id
